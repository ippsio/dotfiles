# [ステータスバー(左側)]
set -g status-left-length  80
set -g  status-left '#{?client_prefix,#[reverse],}'
set -ga status-left 'SES[#S/#{server_sessions}]'
set -ga status-left '|'
set -ga status-left '#{?client_prefix,#[reverse],}'
set -ga status-left ' '
set -ga status-left '#(~/dotfiles/bin/tmux/tmux_current_datetime #{client_width})'
set -ga status-left  '|'
set -ga status-left ' '
set -ga status-left 'BAT'
# 幅は tmux 側で展開して渡す (スクリプト内から tmux を呼び直すと毎秒 fork が増える)
set -ga status-left '#(~/dotfiles/bin/tmux/tmux_battery #{client_width})'
set -ga status-left '#{?client_prefix,#[reverse],}'
set -ga status-left '|'
set -ga status-left ' '
set -ga status-left "#[reverse]#{simple_git_status}#[default] "
