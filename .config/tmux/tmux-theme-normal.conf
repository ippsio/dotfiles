# 通常 (ダーク) テーマ。switch-color off で適用される既定の配色。
#
# 対になる tmux-theme-gray.conf と「同じオプションを必ず両方で定義」すること。
# 片方にしか無い設定は切り替え時に前のテーマの値が残り続ける。

# 現在どちらのテーマかの目印。bin/tmux/tmux_pane_style_with_env が direnv 由来の
# ペイン色 ($TMUX_PANE_STYLE / $TMUX_PANE_STYLE_GRAY) のどちらを使うか判定するのに参照する。
set -g @switch_color             'off'

# ペイン背景。未設定に戻して端末 (alacritty) の背景色を透けさせる。
# ※ ペインスコープ ($TMUX_PANE_STYLE 由来) はグローバルより優先されるため、
#   個別色を持つペインは switch-color 側が別途貼り直す (reapply_pane_styles)。
set -gu window-style
set -gu window-active-style

set -g status-style              'bg=colour238,fg=colour252'
set -g message-style             'bg=colour238,fg=colour220'
# choose-mode での行選択時の色および copy-mode 時の色
set -wg mode-style               'fg=colour255,bg=colour242'

set -g pane-border-style         'bg=colour238'
set -g pane-active-border-style  'bg=colour238'

# pane-border-format から参照される色 (tmux-pane.conf)
set -g @pane_border_fg           'colour187'
set -g @pane_zoomed_bg           'colour88'
