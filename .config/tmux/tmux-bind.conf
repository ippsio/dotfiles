# ペイン移動 Prefix + 'h','j','k','l'
bind h select-pane -L \; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind j select-pane -D \; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind k select-pane -U \; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind l select-pane -R \; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind q display-panes -d 500

# tmuxのコマンドプロンプト表示
#bind C-t run-shell tmux_pane_next \; display-panes -d 750

# ペイン移動その２ Prefix + 'CTRL-h','CTRL-j','CTRL-k','CTRL-l'でも行けるようにする。たぶんその方が指が楽。
bind C-h select-pane -L\; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind C-j select-pane -D\; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind C-k select-pane -U\; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind C-l select-pane -R\; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"

# ペインの移動(ローテート)
bind -n C-left select-pane -L
bind -n C-down select-pane -D
bind -n C-up select-pane -U
bind -n C-right select-pane -R

# ペインリサイズ Prefix + 'H','J','K','L'
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ペインの縦分割 Prefix + '|',または'\'
# bind \| split-window -h -c '#{pane_current_path}'\; last-pane
# bind \\ split-window -h -c '#{pane_current_path}'\; last-pane
bind \| split-window -h -c '#{pane_current_path}'
bind \\ split-window -h -c '#{pane_current_path}'

# ペインの横分割 Prefix + '-'
#bind - split-window
# bind - split-window -v -c '#{pane_current_path}'\; last-pane
bind - split-window -v -c '#{pane_current_path}'
# 驚くようなことですが、
# `bind C-_(CTRL+アンダースコア)` と定義すると、
# `bind C--(CTRL+ハイフン)` を定義したような動作を実現できるようです。
# 一方、
# `bind C--(CTRL+ハイフン)` と定義しても、
# この定義の見た目通りの挙動は発生しませんでした。
# `C-t C-ハイフン`のように CTRLキーを押したままペインの横分割をしたいので、この定義をしています。
# `C-t ハイフン` だと結構キー操作を誤り、うまくペインの横分割ができない確率が多かったのです。。
# bind C-_ split-window -v -c '#{pane_current_path}'\; last-pane
bind C-_ split-window -v -c '#{pane_current_path}'

bind = select-layout tiled
bind -r space next-layout

bind c new-window   -c '#{pane_current_path}'
bind C-c new-window -c '#{pane_current_path}'

# ---------------------
# ウインドウ
# ---------------------
bind o rotate-window
bind C-o rotate-window

# f1,f2,f3でメモ開く
bind -n f1 display-popup -E -w 90% -h 100% 'source $HOME/dotfiles/zshrc/00_export.zsh && eval "$(direnv hook zsh)" && cd $HOME/memo && $HOME/dotfiles/bin/memo/memo_daily'
bind -n f2 display-popup -E -w 90% -h 100% 'source $HOME/dotfiles/zshrc/00_export.zsh && eval "$(direnv hook zsh)" && cd $HOME/memo && $HOME/dotfiles/bin/memo/memo_daily_detail'
bind -n f3 display-popup -E -w 90% -h 100% 'source $HOME/dotfiles/zshrc/00_export.zsh && eval "$(direnv hook zsh)" && cd $HOME/memo && $HOME/dotfiles/bin/memo/memo_onetime'

# 前、次のウインドウを表示
# bind C-n next-window
# bind C-n next-window
bind C-n      run-shell "$HOME/dotfiles/bin/tmux/tmux_next_window_pane"\; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind n        run-shell "$HOME/dotfiles/bin/tmux/tmux_next_window_pane"\; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind -n f11   run-shell "$HOME/dotfiles/bin/tmux/tmux_next_window_pane"\; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind N        run-shell "$HOME/dotfiles/bin/tmux/tmux_next_window_pane --reverse"\; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"
bind -n S-f11 run-shell "$HOME/dotfiles/bin/tmux/tmux_next_window_pane --reverse"\; run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_flash"

# CTRL-semi-colon でtmuxコマンドプロンプト
#bind -n C-\; command-prompt

# ---------------------
# マウス
# ---------------------
## マウス操作を有効にする

set -g mouse on
bind -T edit-mode-vi WheelUpPane send-keys -X scroll-up
bind -T edit-mode-vi WheelDownPane send-keys -X scroll-down

# コピーモードでvimキーバインドを使う

# ---------------------
# コピーモード
# ---------------------
# CTRLを押しながらtを2連打した時、コピーモードに入るようにします。
bind C-t copy-mode\; send -X start-of-line

setw -g mode-keys vi

# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection

# 'V' で行選択
bind -T copy-mode-vi V send -X select-line

# 'C-v' で矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle

# 'y' でヤンク
bind -T copy-mode-vi y send -X copy-selection

# 'Y' で行ヤンク
bind -T copy-mode-vi Y send -X copy-line

#  C-[(　コピーモード開始)と間違って暴発ペーストした事があったので、このbindは廃止。
# 'C-p'でペースト
# bind C-p paste-buffer
unbind C-p
unbind p

# choose-tree
bind w run-shell $HOME/dotfiles/bin/tmux/tmux_choose_window

#bind C-z suspend-client
unbind C-z # C-t C-z してもtmuxを閉じないで下さい。という思いを込めてunbindします。
bind z      run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_resize_z"
bind C-z    run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_resize_z"
bind -n f12 run-shell "$HOME/dotfiles/bin/tmux/tmux_pane_resize_z"

# PrefixキーをCTRL+t に設定しているので,
# C-t C-t といった具合にCTRLを押しながらtを2連打することでメニューが表示されると便利なのではないだろうかと
