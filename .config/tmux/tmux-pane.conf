# ペイン
# 色 (border-style / @pane_* 変数) は tmux-theme-{normal,gray}.conf 側で定義。
# switch-color の on/off で差し替わる。
set -g  pane-border-lines simple
set -g  pane-border-status top

set -g  pane-border-format '#[fg=#{@pane_border_fg}]'
set -ga pane-border-format 'PANE[#I-#P#{?window_zoomed_flag,#[bg=#{@pane_zoomed_bg}]:zoomed#[default],}] # #{pane_current_command} '
set -ga pane-border-format '#[default]'
