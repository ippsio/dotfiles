# グレースケール (ライト) テーマ。switch-color on で適用される。
#
# macOS 側のグレイスケールフィルタ下では彩度が落ちて暗色同士の判別が付きにくいため、
# 明度差だけで読める明るい無彩色に寄せる。
# 対になる tmux-theme-normal.conf と「同じオプションを必ず両方で定義」すること。

# 現在どちらのテーマかの目印。bin/tmux/tmux_pane_style_with_env が direnv 由来の
# ペイン色 ($TMUX_PANE_STYLE / $TMUX_PANE_STYLE_GRAY) のどちらを使うか判定するのに参照する。
set -g @switch_color             'on'

# 個別色を持たないペインの共通背景。
# direnv で色を割り当てたペインはこれより明るい/暗い側に振って区別する (各 .envrc 参照)。
set -g window-style              'fg=#1c1c1c,bg=#f0f0f0'
set -g window-active-style       'fg=#1c1c1c,bg=#f0f0f0'

set -g status-style              'bg=#d0d0d0,fg=#1c1c1c'
set -g message-style             'bg=#d0d0d0,fg=#1c1c1c'
# choose-mode での行選択時の色および copy-mode 時の色
set -wg mode-style               'fg=#f0f0f0,bg=#767676'

set -g pane-border-style         'bg=#c0c0c0,fg=#585858'
set -g pane-active-border-style  'bg=#c0c0c0,fg=#585858'

# pane-border-format から参照される色 (tmux-pane.conf)
set -g @pane_border_fg           '#1c1c1c'
# zoomed 表示は暗色文字が乗るので、赤も明るい側に振る
set -g @pane_zoomed_bg           '#ff8787'
