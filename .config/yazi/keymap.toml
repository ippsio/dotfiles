[[mgr.prepend_keymap]]
on = "<Esc>"
run = "quit"
desc = "Quit yazi"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "d"
run = "noop"
desc = "Disable trash"

[[mgr.prepend_keymap]]
on = "D"
run = "noop"
desc = "Disable permanent delete"

[[mgr.prepend_keymap]]
on = "a"
run = "noop"
desc = "Disable create"

[[mgr.prepend_keymap]]
on = "s"
run = "noop"
desc = "Disable search via fd"

[[mgr.prepend_keymap]]
on = "t"
run = "noop"
desc = "Disable tab"

# [[mgr.prepend_keymap]]
# on = "f"
# run = "find --smart"
# desc = "Find next file"

[[mgr.prepend_keymap]]
on = "/"
run = "filter --smart"
desc = "Filter files"

[[mgr.prepend_keymap]]
on = "k"
run = "arrow -1"
desc = "Move cursor up (no wrap)"

[[mgr.prepend_keymap]]
on = "j"
run = "arrow 1"
desc = "Move cursor down (no wrap)"

[[mgr.prepend_keymap]]
on = "<Up>"
run = "arrow -1"
desc = "Move cursor up (no wrap)"

[[mgr.prepend_keymap]]
on = "<Down>"
run = "arrow 1"
desc = "Move cursor down (no wrap)"

[[input.prepend_keymap]]
on = "<Esc>"
run = ["close", "escape"]
desc = "Close input and clear filter/find/search state"
