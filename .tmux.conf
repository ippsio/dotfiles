set -s default-terminal "tmux-256color"
set -as terminal-overrides ",*-256color:Tc"

set -g prefix C-t
set -s escape-time 0
set -g base-index 1
setw -g automatic-rename on
set -g history-limit 100000
set -g display-panes-time 5000

#set -g window-style              'fg=#444444,bg=#FFFFCC'
#set -g window-active-style       'fg=#444444,bg=#FFFFCC'

set -g message-style             'bg=colour238,fg=colour220'
# choose-mode での行選択時の色および copy-mode 時の色
set -wg mode-style               'fg=colour255,bg=colour242'

# ウインドウを切り替えるたびにステータスバー上にActivity in window *** という表示が出るのが煩わしいので、表示されないようにする。
#setw -g monitor-activity off
#set -g visual-activity off

source-file ~/dotfiles/.config/tmux/tmux-plugin.conf
source-file ~/dotfiles/.config/tmux/tmux-status-misc.conf
source-file ~/dotfiles/.config/tmux/tmux-status-left.conf
source-file ~/dotfiles/.config/tmux/tmux-window-status.conf
source-file ~/dotfiles/.config/tmux/tmux-status-right.conf
source-file ~/dotfiles/.config/tmux/tmux-pane.conf
source-file ~/dotfiles/.config/tmux/tmux-bind.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b "$HOME/.cache/tmux/plugins/tpm/tpm"
