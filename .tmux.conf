set -s default-terminal "tmux-256color"
set -as terminal-overrides ",*-256color:Tc"

set -g prefix C-t
set -s escape-time 0
set -g base-index 1
setw -g automatic-rename on
set -g history-limit 100000
set -g display-panes-time 5000
set -g focus-events on

# 配色 (ペイン背景 / ステータス / ボーダー / message / mode) は
# .config/tmux/tmux-theme-{normal,gray}.conf に集約。最下部で読み込む。

# ウインドウを切り替えるたびにステータスバー上にActivity in window *** という表示が出るのが煩わしいので、表示されないようにする。
#setw -g monitor-activity off
#set -g visual-activity off

# https://yazi-rs.github.io/docs/image-preview/
# > To enable Yazi's image preview to work correctly in tmux, add the following 3 options to your tmux.conf:
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g @plugin 'tmux-plugins/tpm'
source-file $HOME/dotfiles/.config/tmux/tmux-plugin-cpu.conf
source-file $HOME/dotfiles/.config/tmux/tmux-plugin-urlview.conf
source-file $HOME/dotfiles/.config/tmux/tmux-plugin-jump.conf
# source-file ~/dotfiles/.config/tmux/tmux-logger.conf
source-file $HOME/dotfiles/.config/tmux/tmux-status-misc.conf
source-file $HOME/dotfiles/.config/tmux/tmux-status-left.conf
source-file $HOME/dotfiles/.config/tmux/tmux-window-status.conf
source-file $HOME/dotfiles/.config/tmux/tmux-status-right.conf
source-file $HOME/dotfiles/.config/tmux/tmux-pane.conf
source-file $HOME/dotfiles/.config/tmux/tmux-bind.conf

# 配色は switch-color (グレースケール表示) の状態に追従させる。
# グレースケール中に tmux を起動 / 設定リロードしても配色が巻き戻らないよう、
# ここで現在の状態を問い合わせて対応するテーマを読む。
if-shell "$HOME/dotfiles/bin/misc/switch-color status | grep -q '^on$'" \
  "source-file $HOME/dotfiles/.config/tmux/tmux-theme-gray.conf" \
  "source-file $HOME/dotfiles/.config/tmux/tmux-theme-normal.conf"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b "$HOME/.cache/tmux/plugins/tpm/tpm"
